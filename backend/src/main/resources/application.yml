server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: portfolio-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/portfolio_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:manoj@123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=1h

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

  lifecycle:
    timeout-per-shutdown-phase: 30s

# ── Custom App Configuration ──
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRY_MS:3600000}        # 1 Hour
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}    # 7 Days

  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:cst2lifk}
    api-key: ${CLOUDINARY_API_KEY:948333573851979}
    api-secret: ${CLOUDINARY_API_SECRET:dqUGGjEPclg_ClK3ofktBD_G6G0}

  admin:
    email: ${ADMIN_EMAIL:admin@gmail.com}
    password: ${ADMIN_PASSWORD:admin123}

  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}

# ── OpenAPI / Swagger ──
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# ── Actuator ──
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) [trace=%X{requestId:-none}] %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n"
